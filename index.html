<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAD Workspace</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F3EF;
  --surface: #FFFFFF;
  --border: #E8E4DC;
  --border-light: #F0EDE6;
  --text: #1A1916;
  --muted: #8C8880;
  --light: #B5B0A8;
  --accent: #C4873A;
  --accent-bg: #F5EBD9;
  --leslie: #7B9E9A;
  --serena: #9E8FA0;
  --esther: #8FA08E;
  --r: 12px;
  --rs: 8px;
  --nav: 228px;
  --f: 'DM Sans', sans-serif;
  --fd: 'DM Serif Display', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--f); background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* ── LAYOUT ── */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--nav); background: var(--surface); border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; height: 100vh;
  display: flex; flex-direction: column; z-index: 100;
  transition: transform .25s;
}
.sb-brand { padding: 22px 18px 14px; border-bottom: 1px solid var(--border-light); }
.sb-brand h1 { font-family: var(--fd); font-size: 21px; letter-spacing: -.3px; }
.sb-nav { flex: 1; padding: 10px; overflow-y: auto; }
.nav-section { font-size: 11px; font-weight: 600; color: var(--light); letter-spacing: 1px; text-transform: uppercase; padding: 14px 8px 5px; }
.nav-btn {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border-radius: var(--rs); cursor: pointer; color: var(--muted); font-size: 15px;
  transition: all .13s; margin-bottom: 2px; user-select: none; width: 100%;
  background: none; border: none; font-family: var(--f); text-align: left;
}
.nav-btn:hover { background: var(--bg); color: var(--text); }
.nav-btn.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
.nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .65; }
.nav-btn.active svg { opacity: 1; }
.proj-link {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: var(--rs); cursor: pointer; color: var(--muted); font-size: 14px;
  transition: all .13s; margin-bottom: 1px;
}
.proj-link:hover { background: var(--bg); color: var(--text); }
.proj-link.active { background: var(--accent-bg); color: var(--accent); }
.proj-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sb-footer { padding: 10px; border-top: 1px solid var(--border-light); }
.sync-row {
  display: flex; align-items: center; gap: 6px; padding: 7px 10px;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--rs);
  cursor: pointer; font-size: 13px; color: var(--muted); font-family: var(--f); width: 100%;
}
.sync-row:hover { background: var(--border-light); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #8EC98A; flex-shrink: 0; }
.sync-dot.spin { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ── MAIN ── */
.main { margin-left: var(--nav); flex: 1; }
.page { display: none; }
.page.active { display: block; }
.pg-head {
  padding: 30px 34px 0; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.pg-title { font-family: var(--fd); font-size: 32px; letter-spacing: -.5px; line-height: 1.2; }
.pg-sub { font-size: 13px; color: var(--muted); margin-top: 3px; font-weight: 300; }
.pg-body { padding: 22px 34px 52px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--rs); font-family: var(--f);
  font-size: 13px; font-weight: 500; cursor: pointer; border: none;
  transition: all .13s; white-space: nowrap;
}
.btn-primary { background: var(--text); color: #fff; }
.btn-primary:hover { background: #2d2c29; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { background: var(--bg); color: var(--text); border-color: var(--light); }
.btn-danger { background: #FEF0F0; color: #D14040; border: 1px solid #FADADA; }
.btn-danger:hover { background: #FADADA; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── CARD ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
.card-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--light); margin-bottom: 14px; }

/* ── AVATARS ── */
.av { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
.av-lg { width: 32px; height: 32px; font-size: 12px; }
.av-xs { width: 20px; height: 20px; font-size: 9px; }
.av.L { background: var(--leslie); }
.av.S { background: var(--serena); }
.av.E { background: var(--esther); }

/* ── DASHBOARD ── */
.dash-grid { display: grid; grid-template-columns: 310px 1fr; gap: 18px; align-items: start; }
.dash-left { display: flex; flex-direction: column; gap: 14px; }
.dash-right { display: flex; flex-direction: column; gap: 14px; }

/* ── CALENDAR ── */
.cal-widget { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-title { font-family: var(--fd); font-size: 17px; }
.cal-arr { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: var(--rs); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
.cal-arr:hover { background: var(--bg); color: var(--text); }
.cal-dow { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 3px; }
.cal-dow span { text-align: center; font-size: 10px; font-weight: 600; color: var(--light); padding: 3px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: var(--rs); font-size: 12px; cursor: pointer; color: var(--text);
  position: relative; transition: background .1s; user-select: none;
}
.cal-day:hover { background: var(--bg); }
.cal-day.dim { color: var(--light); }
.cal-day.today { color: var(--accent); font-weight: 600; border: 1.5px solid var(--accent); }
.cal-day.sel { background: var(--text) !important; color: #fff !important; border: none; }
.cal-day.has-ev::after { content: ''; width: 3px; height: 3px; border-radius: 50%; background: var(--accent); position: absolute; bottom: 2px; }
.cal-day.sel.has-ev::after { background: rgba(255,255,255,.6); }
.cal-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border-light); }
.leg-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.leg-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.cal-clear { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 9px; display: inline-block; }
.cal-clear:hover { text-decoration: underline; }

/* ── EVENTS PANEL ── */
.ev-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
.ev-date { font-family: var(--fd); font-size: 18px; margin-bottom: 12px; }
.ev-row { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border-light); align-items: flex-start; }
.ev-row:last-child { border-bottom: none; }
.ev-bar { width: 3px; border-radius: 2px; flex-shrink: 0; align-self: stretch; min-height: 18px; }
.ev-info { flex: 1; }
.ev-name { font-size: 15px; font-weight: 500; }
.ev-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.ev-edit { color: var(--light); cursor: pointer; font-size: 13px; padding: 2px; }
.ev-edit:hover { color: var(--accent); }
.up-head { font-size: 11px; color: var(--light); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin: 10px 0 4px; }
.c-meeting { background: #4B7BE5; }
.c-event { background: var(--accent); }
.c-leave { background: #8EC98A; }
.c-ph { background: #B89EE0; }

/* ── FLAGGED ── */
.flag-item { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); margin-bottom: 7px; }
.flag-item:hover { border-color: var(--accent); }
.flag-chk { width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.flag-chk.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.flag-name { font-size: 15px; color: var(--text); flex: 1; }
.flag-proj { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── FLAG ICON ON TASK CARD ── */
.task-flag-btn { background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: 14px; opacity: .3; transition: opacity .13s; line-height: 1; flex-shrink: 0; }
.task-flag-btn:hover, .task-flag-btn.on { opacity: 1; color: var(--accent); }

/* ── DRAG & DROP ── */
.task-card { cursor: grab; }
.task-card.dragging { opacity: .4; cursor: grabbing; }
.k-col.drag-over { background: var(--accent-bg); border-color: var(--accent); }

/* ── SEARCH CLEAR ── */
.search-wrap { position: relative; flex: 1; min-width: 160px; }
.search-wrap input { width: 100%; padding: 8px 32px 8px 12px; border: 1px solid var(--border); border-radius: var(--rs); font-family: var(--f); font-size: 13px; outline: none; background: var(--surface); }
.search-wrap input:focus { border-color: var(--accent); }
.search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--light); font-size: 16px; line-height: 1; padding: 0 2px; }
.search-clear:hover { color: var(--text); }

/* ── PROJECT DETAIL ── */
.proj-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
.kanban { display: flex; flex-direction: column; gap: 10px; }
.k-col { background: var(--bg); border: 1px solid var(--border-light); border-radius: var(--r); padding: 13px; }
.k-col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.k-col-title { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
.k-count { font-size: 11px; color: var(--light); background: var(--border-light); padding: 1px 7px; border-radius: 10px; }
.k-tasks { display: flex; flex-direction: column; gap: 7px; }
.task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); padding: 11px 13px; cursor: pointer; transition: border-color .13s; }
.task-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.task-name { font-size: 15px; line-height: 1.4; }
.task-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }
.p-dot { width: 7px; height: 7px; border-radius: 50%; }
.p-high { background: #E07070; } .p-med { background: var(--accent); } .p-low { background: #8EC98A; } .p-await { background: #B89EE0; }
.add-task-row { margin-top: 7px; }
.add-task-btn-inline {
  font-size: 12px; color: var(--light); cursor: pointer; padding: 6px 10px;
  border: 1px dashed var(--border); border-radius: var(--rs); background: none;
  font-family: var(--f); transition: all .13s;
}
.add-task-btn-inline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

/* ── NOTES PANEL (project page) ── */
.notes-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); display: flex; flex-direction: column; max-height: calc(100vh - 140px); min-height: 500px; }
.np-head { padding: 13px 15px; border-bottom: 1px solid var(--border-light); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--light); flex-shrink: 0; }
.np-list { flex: 1; overflow-y: auto; }
.np-item { padding: 11px 15px; border-bottom: 1px solid var(--border-light); }
.np-item:last-child { border-bottom: none; }
.np-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.np-date { font-size: 11px; color: var(--light); }
.np-text { font-size: 13px; color: var(--text); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.np-actions { display: flex; gap: 5px; margin-top: 5px; opacity: 0; transition: opacity .12s; }
.np-item:hover .np-actions { opacity: 1; }
.np-btn { font-size: 11px; color: var(--light); cursor: pointer; padding: 2px 6px; border-radius: 4px; border: none; background: var(--bg); font-family: var(--f); }
.np-btn:hover { background: var(--border); color: var(--text); }
.np-btn.del:hover { background: #FADADA; color: #D14040; }
.np-compose { padding: 11px 15px; border-top: 1px solid var(--border-light); flex-shrink: 0; }
.who-row { display: flex; gap: 5px; margin-bottom: 8px; }
.who-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; font-size: 10px; font-weight: 600; color: #fff; font-family: var(--f); display: flex; align-items: center; justify-content: center; }
.who-btn.L { background: var(--leslie); } .who-btn.S { background: var(--serena); } .who-btn.E { background: var(--esther); }
.who-btn.sel { border-color: var(--text); }
.compose-row { display: flex; gap: 7px; align-items: flex-end; }
.compose-ta { flex: 1; border: 1px solid var(--border); border-radius: var(--rs); padding: 8px 10px; font-family: var(--f); font-size: 13px; color: var(--text); background: var(--bg); outline: none; resize: vertical; line-height: 1.5; min-height: 90px; max-height: 200px; }
.compose-ta:focus { border-color: var(--accent); background: var(--surface); }
.compose-send { width: 32px; height: 32px; border-radius: var(--rs); background: var(--text); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: flex-end; }
.compose-send:hover { background: var(--accent); }

/* ── NOTES PAGE ── */
.notes-pg-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
.notes-search-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.notes-search { flex: 1; min-width: 160px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--rs); font-family: var(--f); font-size: 13px; outline: none; background: var(--surface); }
.notes-search:focus { border-color: var(--accent); }
.flt-btn { padding: 7px 12px; font-size: 11px; border: 1px solid var(--border); border-radius: var(--rs); background: var(--surface); cursor: pointer; color: var(--muted); font-family: var(--f); transition: all .13s; white-space: nowrap; }
.flt-btn:hover, .flt-btn.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-bg); }
.notes-sections { display: flex; flex-direction: column; gap: 20px; }
.proj-section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.proj-section-name { font-family: var(--fd); font-size: 17px; }
.proj-section-cnt { font-size: 11px; color: var(--muted); }
.note-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); padding: 11px 13px; margin-bottom: 6px; cursor: pointer; transition: border-color .12s; }
.note-card:hover { border-color: var(--accent); }
.note-card.on { border-color: var(--accent); background: var(--accent-bg); }
.note-preview { font-size: 13px; color: var(--text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-card-meta { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 11px; color: var(--light); }
.note-view { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; position: sticky; top: 22px; }

/* ── MODAL ── */
.modal-bg { position: fixed; inset: 0; background: rgba(20,18,14,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .18s; }
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border-radius: var(--r); padding: 26px; width: 100%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,.15); transform: translateY(8px); transition: transform .18s; max-height: 90vh; overflow-y: auto; }
.modal-bg.open .modal { transform: translateY(0); }
.modal-title { font-family: var(--fd); font-size: 21px; margin-bottom: 18px; }
.modal-x { float: right; cursor: pointer; color: var(--light); font-size: 19px; line-height: 1; }
.modal-x:hover { color: var(--text); }
.fg { margin-bottom: 15px; }
.fg label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; letter-spacing: .3px; }
.fg input, .fg select, .fg textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--rs);
  font-family: var(--f); font-size: 15px; color: var(--text); background: var(--surface);
  outline: none; -webkit-appearance: none;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--accent); }
.fg textarea { resize: vertical; min-height: 66px; line-height: 1.5; }
.fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .12s; }
.swatch:hover { transform: scale(1.15); }
.swatch.sel { border-color: var(--text); }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-a { background: #EAF6E9; color: #4A9048; }
.badge-h { background: #FFF3E0; color: #C4803A; }
.badge-d { background: #EEF2FF; color: #5B6FAD; }

/* ── EMPTY ── */
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
.empty-icon { font-size: 22px; margin-bottom: 6px; opacity: .45; }
.empty-text { font-size: 13px; }

/* ── HAMBURGER ── */
.hamburger { display: none; position: fixed; top: 13px; left: 13px; z-index: 200; background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); padding: 8px 9px; cursor: pointer; }
.hamburger span { display: block; width: 18px; height: 2px; background: var(--text); margin: 3px 0; border-radius: 1px; }
.backdrop { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,.3); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
  .proj-layout { grid-template-columns: 1fr; }
  .notes-pg-layout { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .hamburger { display: block; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 0 4px 20px rgba(0,0,0,.1); }
  .backdrop.open { display: block; }
  .main { margin-left: 0; }
  .pg-head { padding: 58px 16px 0; flex-direction: column; gap: 10px; }
  .pg-body { padding: 14px 16px 60px; }
  .fg-row { grid-template-columns: 1fr; }
  .modal { padding: 18px; }
}
</style>
</head>
<body>

<button class="hamburger" id="hbg" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="backdrop" id="bkd" onclick="closeSidebar()"></div>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sb-brand"><h1>LAD Workspace</h1></div>
  <nav class="sb-nav">
    <div class="nav-section">Main</div>
    <button class="nav-btn active" id="nb-dashboard" onclick="goPage('dashboard',this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/>
        <rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/>
      </svg>Dashboard
    </button>
    <button class="nav-btn" id="nb-notes" onclick="goPage('notes',this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M5 6h6M5 9h4"/>

<script>
/* ═══════════════════════════════════════════════
   FIREBASE CONFIG — replace with your real values
   ═══════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSy8-jTbZWqu8WKL4sq8Y6CFEn9YCjxc662U",
  authDomain: "lad-workspace.firebaseapp.com",
  databaseURL: "https://lad-workspace-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lad-workspace",
  storageBucket: "lad-workspace.firebasestorage.app",
  messagingSenderId: "946891587110",
  appId: "1:946891587110:web:faca7cffe1028a11c6f0e7"
};

/* ── STATE ── */
var db = null;
var USE_FB = false;
var state = { projects: {}, tasks: {}, events: {}, notes: {} };
var curPage = 'dashboard';
var curProjId = null;
var editTaskId = null;
var editEventId = null;
var editNoteId = null;
var noteWho = 'L';
var notesFilter = 'all';
var viewNoteId = null;

/* calendar state */
var CAL = { year: 0, month: 0, sel: null };

/* ── UTILS ── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function pad2(n) { return String(n).padStart(2, '0'); }
function dateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function displayDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long' }); }
function shortDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-SG', { day:'numeric', month:'short' }); }
function dayName(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-SG', { weekday:'short' }); }

var TODAY = new Date();
TODAY.setHours(0,0,0,0);
var TODAY_STR = dateStr(TODAY);

/* ── STORAGE ── */
function loadLocal() {
  try { var s = localStorage.getItem('lad_v5'); if (s) state = Object.assign({ projects:{}, tasks:{}, events:{}, notes:{} }, JSON.parse(s)); } catch(e) {}
}
function saveLocal() { try { localStorage.setItem('lad_v5', JSON.stringify(state)); } catch(e) {} }
function persist() {
  saveLocal();
  if (USE_FB) {
    setSyncing(true);
    db.ref('/').update({ projects: state.projects||{}, tasks: state.tasks||{}, events: state.events||{}, notes: state.notes||{} })
      .then(function(){ setSyncing(false); }).catch(function(){ setSyncing(false); });
  }
}

/* ── FIREBASE ── */
function initFB() {
  try {
    if (FB.apiKey === 'YOUR_API_KEY') return;
    firebase.initializeApp(FB);
    db = firebase.database();
    USE_FB = true;
    setSyncing(true);
    db.ref('/').on('value', function(snap) {
      var v = snap.val();
      if (v) {
        state = Object.assign({ projects:{}, tasks:{}, events:{}, notes:{} }, v);
        saveLocal();
        renderAll();
      }
      setSyncing(false);
    }, function(err) {
      console.warn('Firebase error', err);
      document.getElementById('sync-lbl').textContent = 'Sync error';
      setSyncing(false);
    });
  } catch(e) { console.warn('Firebase init failed', e); }
}
function setSyncing(on) {
  var dot = document.getElementById('sync-dot');
  var lbl = document.getElementById('sync-lbl');
  if (dot) dot.classList.toggle('spin', on);
  if (lbl) lbl.textContent = on ? 'Syncing…' : (USE_FB ? 'Connected' : 'Local only');
}
function manualSync() {
  if (USE_FB) {
    setSyncing(true);
    db.ref('/').update({ projects: state.projects||{}, tasks: state.tasks||{}, events: state.events||{}, notes: state.notes||{} })
      .then(function(){ setSyncing(false); }).catch(function(){ setSyncing(false); });
  }
}

/* ── NAVIGATION ── */
function goPage(name, btn) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  var pg = document.getElementById('page-' + name);
  if (pg) pg.classList.add('active');
  if (btn) btn.classList.add('active');
  curPage = name;
  closeSidebar();
  if (name === 'dashboard') renderDash();
  if (name === 'notes') renderNotes();
}
function goProject(id) {
  curProjId = id;
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  var pg = document.getElementById('page-project');
  if (pg) pg.classList.add('active');
  curPage = 'project';
  closeSidebar();
  renderProject(id);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('bkd').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('bkd').classList.remove('open');
}

/* ── MODALS ── */
function openModal(type) {
  if (type === 'task') {
    editTaskId = null;
    document.getElementById('t-modal-title').textContent = 'Add Task';
    document.getElementById('t-name').value = '';
    document.getElementById('t-status').value = 'todo';
    document.getElementById('t-priority').value = 'med';
    document.getElementById('t-assignee').value = '';
    document.getElementById('t-notes').value = '';
    setFlagBtn(false);
    document.getElementById('t-del-btn').style.display = 'none';
    fillProjectSelect(curProjId);
  }
  if (type === 'event') {
    editEventId = null;
    document.getElementById('e-modal-title').textContent = 'Add Event';
    document.getElementById('e-name').value = '';
    document.getElementById('e-start').value = CAL.sel ? CAL.sel : TODAY_STR;
    document.getElementById('e-end').value = '';
    document.getElementById('e-type').value = 'meeting';
    document.getElementById('e-time0').value = '';
    document.getElementById('e-time1').value = '';
    document.getElementById('e-notes').value = '';
    document.getElementById('e-del-btn').style.display = 'none';
  }
  if (type === 'project') {
    document.querySelectorAll('#p-colors .swatch').forEach(function(s,i){ s.classList.toggle('sel', i===0); });
    document.getElementById('p-name').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-status').value = 'active';
  }
  document.getElementById('m-' + type).classList.add('open');
  setTimeout(function(){
    var f = document.querySelector('#m-' + type + ' input[type=text], #m-' + type + ' input:not([type])');
    if (f) f.focus();
  }, 120);
}
function openEditTask(id) {
  var t = state.tasks[id]; if (!t) return;
  editTaskId = id;
  document.getElementById('t-modal-title').textContent = 'Edit Task';
  document.getElementById('t-name').value = t.name || '';
  document.getElementById('t-status').value = t.status || 'todo';
  document.getElementById('t-priority').value = t.priority || 'med';
  document.getElementById('t-assignee').value = t.assignee || '';
  document.getElementById('t-notes').value = t.notes || '';
  setFlagBtn(!!t.flagged);
  document.getElementById('t-del-btn').style.display = 'inline-flex';
  fillProjectSelect(t.projectId);
  document.getElementById('m-task').classList.add('open');
}
function openEditEvent(id) {
  var e = state.events[id]; if (!e) return;
  editEventId = id;
  document.getElementById('e-modal-title').textContent = 'Edit Event';
  document.getElementById('e-name').value = e.name || '';
  document.getElementById('e-start').value = e.start || '';
  document.getElementById('e-end').value = e.end || '';
  document.getElementById('e-type').value = e.type || 'meeting';
  document.getElementById('e-time0').value = e.t0 || '';
  document.getElementById('e-time1').value = e.t1 || '';
  document.getElementById('e-notes').value = e.notes || '';
  document.getElementById('e-del-btn').style.display = 'inline-flex';
  document.getElementById('m-event').classList.add('open');
}
function closeModal(type) {
  document.getElementById('m-' + type).classList.remove('open');
}
function fillProjectSelect(selId) {
  var sel = document.getElementById('t-project');
  sel.innerHTML = '<option value="">— No project —</option>';
  Object.keys(state.projects).forEach(function(id) {
    var p = state.projects[id];
    if (p && !p.archived) {
      var opt = document.createElement('option');
      opt.value = id; opt.textContent = p.name;
      if (id === selId) opt.selected = true;
      sel.appendChild(opt);
    }
  });
}
function pickColor(el) {
  document.querySelectorAll('#p-colors .swatch').forEach(function(s){ s.classList.remove('sel'); });
  el.classList.add('sel');
}

/* ── SAVE FUNCTIONS ── */
function saveProject() {
  var name = document.getElementById('p-name').value.trim();
  if (!name) { document.getElementById('p-name').focus(); return; }
  var colorEl = document.querySelector('#p-colors .swatch.sel');
  var id = uid();
  state.projects[id] = {
    name: name,
    desc: document.getElementById('p-desc').value.trim(),
    status: document.getElementById('p-status').value,
    color: colorEl ? colorEl.getAttribute('data-c') : '#C4873A',
    created: Date.now()
  };
  persist();
  closeModal('project');
  renderSidebar();
}
function saveTask() {
  var name = document.getElementById('t-name').value.trim();
  if (!name) { document.getElementById('t-name').focus(); return; }
  var id = editTaskId || uid();
  state.tasks[id] = {
    name: name,
    projectId: document.getElementById('t-project').value,
    status: document.getElementById('t-status').value,
    priority: document.getElementById('t-priority').value,
    assignee: document.getElementById('t-assignee').value,
    notes: document.getElementById('t-notes').value.trim(),
    flagged: document.getElementById('t-flag').value === '1',
    created: (state.tasks[id] && state.tasks[id].created) || Date.now(),
    updated: Date.now()
  };
  persist();
  closeModal('task');
  if (curPage === 'project' && curProjId) renderKanban(curProjId);
  if (curPage === 'dashboard') renderDash();
  renderSidebar();
}
function deleteTask() {
  if (!editTaskId || !confirm('Delete this task?')) return;
  delete state.tasks[editTaskId];
  editTaskId = null;
  persist();
  closeModal('task');
  if (curPage === 'project' && curProjId) renderKanban(curProjId);
  if (curPage === 'dashboard') renderDash();
}
function saveEvent() {
  var name = document.getElementById('e-name').value.trim();
  var start = document.getElementById('e-start').value;
  if (!name) { document.getElementById('e-name').focus(); return; }
  if (!start) { document.getElementById('e-start').focus(); return; }
  var id = editEventId || uid();
  state.events[id] = {
    name: name, start: start,
    end: document.getElementById('e-end').value || start,
    type: document.getElementById('e-type').value,
    t0: document.getElementById('e-time0').value,
    t1: document.getElementById('e-time1').value,
    notes: document.getElementById('e-notes').value.trim(),
    created: (state.events[id] && state.events[id].created) || Date.now()
  };
  persist();
  closeModal('event');
  if (curPage === 'dashboard') renderDash();
}
function deleteEvent() {
  if (!editEventId || !confirm('Delete this event?')) return;
  delete state.events[editEventId];
  editEventId = null;
  persist();
  closeModal('event');
  if (curPage === 'dashboard') renderDash();
}

/* ── CALENDAR ── */
function evColor(type) {
  return { meeting:'#4B7BE5', event:'#C4873A', leave:'#8EC98A', ph:'#B89EE0' }[type] || '#C4873A';
}
function evLabel(type) {
  return { meeting:'Meeting', event:'Event', leave:'Leave', ph:'PH' }[type] || type;
}
function eventsOn(ds) {
  return Object.keys(state.events).filter(function(id) {
    var e = state.events[id];
    return e && e.start <= ds && ds <= (e.end || e.start);
  });
}
function renderCal() {
  var mo = new Date(CAL.year, CAL.month, 1);
  document.getElementById('cal-month').textContent = mo.toLocaleDateString('en-SG', { month:'long', year:'numeric' });
  var lastDay = new Date(CAL.year, CAL.month+1, 0).getDate();
  var startDow = mo.getDay(); // 0=Sun
  var offset = startDow === 0 ? 6 : startDow - 1; // Mon-based
  var html = '';
  // prev month filler
  var prevLast = new Date(CAL.year, CAL.month, 0).getDate();
  for (var i = offset-1; i >= 0; i--) {
    html += '<div class="cal-day dim">' + (prevLast - i) + '</div>';
  }
  // current month
  for (var d = 1; d <= lastDay; d++) {
    var ds = CAL.year + '-' + pad2(CAL.month+1) + '-' + pad2(d);
    var cls = 'cal-day';
    if (ds === TODAY_STR) cls += ' today';
    if (CAL.sel && ds === CAL.sel) cls += ' sel';
    if (eventsOn(ds).length) cls += ' has-ev';
    html += '<div class="' + cls + '" onclick="calSelect(\'' + ds + '\')" ondblclick="calDblClick(\'' + ds + '\')" title="Double-click to add event">' + d + '</div>';
  }
  // next month filler
  var total = offset + lastDay;
  var rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (var i = 1; i <= rem; i++) {
    html += '<div class="cal-day dim">' + i + '</div>';
  }
  document.getElementById('cal-days').innerHTML = html;
}
function calPrev() { CAL.month--; if (CAL.month < 0) { CAL.month = 11; CAL.year--; } renderCal(); }
function calNext() { CAL.month++; if (CAL.month > 11) { CAL.month = 0; CAL.year++; } renderCal(); }
function calSelect(ds) {
  CAL.sel = ds;
  // update year/month to match selection
  var parts = ds.split('-');
  CAL.year = parseInt(parts[0]);
  CAL.month = parseInt(parts[1]) - 1;
  renderCal();
  renderDayEvents();
}
function calDblClick(ds) {
  CAL.sel = ds;
  openModal('event');
  // pre-fill the date
  var el = document.getElementById('e-start');
  if (el) el.value = ds;
}
function calClear() {
  CAL.sel = TODAY_STR;
  CAL.year = TODAY.getFullYear();
  CAL.month = TODAY.getMonth();
  renderCal();
  renderDayEvents();
}
function renderDayEvents() {
  var ds = CAL.sel || TODAY_STR;
  var lbl = document.getElementById('ev-date-label');
  var list = document.getElementById('ev-day-list');
  if (!lbl || !list) return;
  lbl.textContent = displayDate(ds);
  var ids = eventsOn(ds);
  if (!ids.length) { list.innerHTML = '<div class="empty" style="padding:10px 0"><div class="empty-text">No events this day</div></div>'; return; }
  list.innerHTML = ids.map(function(id) {
    var e = state.events[id];
    return '<div class="ev-row">' +
      '<div class="ev-bar" style="background:' + evColor(e.type) + '"></div>' +
      '<div class="ev-info"><div class="ev-name">' + esc(e.name) + '</div>' +
      '<div class="ev-meta">' + evLabel(e.type) + (e.t0 ? ' · ' + e.t0 + (e.t1 ? '–'+e.t1 : '') : '') + (e.notes ? ' · ' + esc(e.notes.substring(0,40)) : '') + '</div></div>' +
      '<div class="ev-edit" onclick="openEditEvent(\'' + id + '\')" title="Edit">✎</div>' +
      '</div>';
  }).join('');
}
function renderUpcoming() {
  var el = document.getElementById('ev-upcoming');
  if (!el) return;
  var in30 = new Date(TODAY); in30.setDate(in30.getDate() + 30);
  var in30s = dateStr(in30);
  var future = Object.keys(state.events).filter(function(id) {
    var e = state.events[id];
    return e && (e.end || e.start) >= TODAY_STR && e.start <= in30s;
  }).sort(function(a,b){ return state.events[a].start.localeCompare(state.events[b].start); });
  if (!future.length) { el.innerHTML = '<div class="empty" style="padding:8px 0"><div class="empty-text">Nothing in the next 30 days</div></div>'; return; }
  var html = '', lastDate = '';
  future.forEach(function(id) {
    var e = state.events[id];
    if (e.start !== lastDate) {
      html += '<div class="up-head">' + shortDate(e.start) + ' (' + dayName(e.start) + ')</div>';
      lastDate = e.start;
    }
    html += '<div class="ev-row" style="padding:5px 0;cursor:pointer" onclick="openEditEvent(\'' + id + '\')">' +
      '<div class="ev-bar" style="background:' + evColor(e.type) + '"></div>' +
      '<div class="ev-info"><div class="ev-name" style="font-size:14px">' + esc(e.name) + '</div>' +
      '<div class="ev-meta">' + evLabel(e.type) + (e.t0 ? ' · ' + e.t0 : '') + '</div></div>' +
      '</div>';
  });
  el.innerHTML = html;
}

/* ── DASHBOARD ── */
function renderDash() {
  // date label
  var dl = document.getElementById('dash-date');
  if (dl) dl.textContent = TODAY.toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  renderCal();
  renderDayEvents();
  renderUpcoming();
  // flagged tasks
  var fl = document.getElementById('flagged-list');
  if (!fl) return;
  var flagged = Object.keys(state.tasks).filter(function(id){ var t=state.tasks[id]; return t && t.flagged && t.status !== 'done'; });
  if (!flagged.length) { fl.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">All clear</div></div>'; return; }
  fl.innerHTML = flagged.map(function(id) {
    var t = state.tasks[id];
    var proj = t.projectId && state.projects[t.projectId] ? state.projects[t.projectId] : null;
    return '<div class="flag-item">' +
      '<div class="flag-chk' + (t.status==='done'?' done':'') + '" onclick="toggleDone(\'' + id + '\')">' + (t.status==='done'?'✓':'') + '</div>' +
      '<div style="flex:1"><div class="flag-name">' + esc(t.name) + '</div>' + (proj?'<div class="flag-proj">'+esc(proj.name)+'</div>':'') + '</div>' +
      '<button class="btn btn-ghost btn-sm" onclick="openEditTask(\'' + id + '\')">Edit</button>' +
      '</div>';
  }).join('');
}
function toggleDone(id) {
  var t = state.tasks[id]; if (!t) return;
  t.status = t.status === 'done' ? 'todo' : 'done';
  persist(); renderDash();
}

/* ── SIDEBAR ── */
function renderSidebar() {
  var cont = document.getElementById('proj-links');
  if (!cont) return;
  var entries = Object.keys(state.projects).filter(function(id){ var p = state.projects[id]; return p && !p.archived; });
  if (!entries.length) { cont.innerHTML = '<div style="padding:3px 10px;font-size:12px;color:var(--light)">No projects</div>'; return; }
  cont.innerHTML = entries.map(function(id) {
    var p = state.projects[id];
    var active = curPage === 'project' && curProjId === id;
    return '<div class="proj-link' + (active?' active':'') + '" onclick="goProject(\'' + id + '\')">' +
      '<div class="proj-dot" style="background:' + (p.color||'#C4873A') + '"></div>' +
      esc(p.name) + '</div>';
  }).join('');
}

/* ── PROJECT PAGE ── */
var COLS = [
  { id:'todo', label:'To Do' },
  { id:'inprogress', label:'In Progress' },
  { id:'awaiting', label:'Awaiting Response' },
  { id:'done', label:'Done' }
];
function renderProject(id) {
  var p = state.projects[id]; if (!p) return;
  document.getElementById('proj-title').textContent = p.name;
  document.getElementById('proj-sub').textContent = p.desc || '';
  document.getElementById('btn-add-task').onclick = function(){ curProjId = id; openModal('task'); };
  document.getElementById('btn-proj-archive').onclick = function(){
    if (!confirm('Archive this project?')) return;
    state.projects[id].archived = true; persist(); renderSidebar();
    goPage('dashboard', document.getElementById('nb-dashboard'));
  };
  document.getElementById('btn-proj-delete').onclick = function(){
    if (!confirm('Delete project and all its tasks?')) return;
    delete state.projects[id];
    Object.keys(state.tasks).forEach(function(tid){ if (state.tasks[tid].projectId === id) delete state.tasks[tid]; });
    if (state.notes[id]) delete state.notes[id];
    persist(); renderSidebar();
    goPage('dashboard', document.getElementById('nb-dashboard'));
  };
  renderKanban(id);
  renderNotePanel(id);
}

/* ── FLAG BUTTON HELPERS ── */
function setFlagBtn(on) {
  document.getElementById('t-flag').value = on ? '1' : '0';
  var icon = document.getElementById('t-flag-icon');
  var btn = document.getElementById('t-flag-btn');
  if (icon) { icon.style.opacity = on ? '1' : '.35'; icon.style.color = on ? 'var(--accent)' : 'inherit'; }
  if (btn) btn.style.color = on ? 'var(--accent)' : 'var(--muted)';
}
function toggleFlagBtn() {
  var cur = document.getElementById('t-flag').value === '1';
  setFlagBtn(!cur);
}

/* ── CLEAR SEARCH ── */
function clearSearch() {
  var q = document.getElementById('notes-q');
  if (q) { q.value = ''; renderNotes(); }
}

/* ── EXPORT / IMPORT ── */
function exportData() {
  var json = JSON.stringify(state, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lad-workspace-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importData(input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      if (!parsed.projects && !parsed.tasks) { alert('Invalid backup file.'); return; }
      if (!confirm('This will replace all current data with the backup. Continue?')) return;
      state = Object.assign({ projects:{}, tasks:{}, events:{}, notes:{} }, parsed);
      persist();
      renderAll();
      alert('Data imported successfully.');
    } catch(err) { alert('Could not read file: ' + err.message); }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ── KANBAN with drag-drop + flag button ── */
var dragTaskId = null;
var dragFromCol = null;

function renderKanban(projId) {
  var kb = document.getElementById('kanban'); if (!kb) return;
  var tasks = Object.keys(state.tasks).filter(function(id){ return state.tasks[id].projectId === projId; });
  kb.innerHTML = COLS.map(function(col) {
    var colTasks = tasks.filter(function(id){ return state.tasks[id].status === col.id; });
    var cards = colTasks.map(function(id) {
      var t = state.tasks[id];
      var av = t.assignee ? '<div class="av av-xs ' + t.assignee + '" style="flex-shrink:0">' + t.assignee + '</div>' : '';
      var flagOn = t.flagged ? ' on' : '';
      return '<div class="task-card" draggable="true" data-id="' + id + '" data-col="' + col.id + '">' +
        '<div style="display:flex;align-items:flex-start;gap:8px">' +
        '<div class="task-name" style="flex:1" onclick="openEditTask(\'' + id + '\')">' + esc(t.name) + '</div>' +
        '<button class="task-flag-btn' + flagOn + '" title="Flag task" onclick="quickFlag(\'' + id + '\',\'' + projId + '\')" data-id="' + id + '">⚑</button>' +
        '</div>' +
        '<div class="task-meta" style="margin-top:6px">' + av + '</div>' +
        '</div>';
    }).join('');
    return '<div class="k-col" data-col="' + col.id + '" data-proj="' + projId + '">' +
      '<div class="k-col-head"><span class="k-col-title">' + col.label + '</span><span class="k-count">' + colTasks.length + '</span></div>' +
      '<div class="k-tasks" data-col="' + col.id + '" data-proj="' + projId + '">' + cards + '</div>' +
      '<div class="add-task-row"><button class="add-task-btn-inline" onclick="(function(){curProjId=\'' + projId + '\';openModal(\'task\');document.getElementById(\'t-status\').value=\'' + col.id + '\'})()">+ Add task</button></div>' +
      '</div>';
  }).join('');
  initDrag(projId);
}

function quickFlag(taskId, projId) {
  var t = state.tasks[taskId]; if (!t) return;
  t.flagged = !t.flagged;
  persist();
  renderKanban(projId);
  if (curPage === 'dashboard') renderDash();
}

function initDrag(projId) {
  var cards = document.querySelectorAll('#kanban .task-card');
  var cols = document.querySelectorAll('#kanban .k-col');
  cards.forEach(function(card) {
    card.addEventListener('dragstart', function(e) {
      dragTaskId = card.getAttribute('data-id');
      dragFromCol = card.getAttribute('data-col');
      setTimeout(function(){ card.classList.add('dragging'); }, 0);
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
      cols.forEach(function(c){ c.classList.remove('drag-over'); });
    });
  });
  cols.forEach(function(col) {
    col.addEventListener('dragover', function(e) {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function() {
      col.classList.remove('drag-over');
    });
    col.addEventListener('drop', function(e) {
      e.preventDefault();
      col.classList.remove('drag-over');
      var toCol = col.getAttribute('data-col');
      if (dragTaskId && toCol && toCol !== dragFromCol) {
        state.tasks[dragTaskId].status = toCol;
        persist();
        renderKanban(projId);
        if (curPage === 'dashboard') renderDash();
      }
    });
  });
}

/* ── PROJECT NOTES ── */
function setWho(el) {
  noteWho = el.getAttribute('data-w');
  document.querySelectorAll('.who-btn').forEach(function(b){ b.classList.remove('sel'); });
  el.classList.add('sel');
}
function addNote() {
  var ta = document.getElementById('note-ta');
  var text = ta.value.trim();
  if (!text || !curProjId) return;
  if (!state.notes[curProjId]) state.notes[curProjId] = {};
  state.notes[curProjId][uid()] = { text: text, who: noteWho, ts: Date.now() };
  persist(); ta.value = '';
  renderNotePanel(curProjId);
}
function renderNotePanel(projId) {
  var list = document.getElementById('np-list'); if (!list) return;
  var notes = state.notes[projId] || {};
  var entries = Object.keys(notes).sort(function(a,b){ return notes[a].ts - notes[b].ts; });
  if (!entries.length) { list.innerHTML = '<div class="empty"><div class="empty-text">No notes yet</div></div>'; return; }
  list.innerHTML = entries.map(function(nid) {
    var n = notes[nid];
    var dt = new Date(n.ts).toLocaleDateString('en-SG', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    if (editNoteId === nid) {
      return '<div class="np-item" id="np-' + nid + '">' +
        '<div class="np-meta"><div class="av av-xs ' + n.who + '">' + n.who + '</div><span class="np-date">' + dt + '</span></div>' +
        '<textarea class="compose-ta" id="ne-' + nid + '" style="width:100%;margin-top:5px">' + esc(n.text) + '</textarea>' +
        '<div style="display:flex;gap:5px;margin-top:5px">' +
        '<button class="btn btn-primary btn-sm" onclick="saveNoteEdit(\'' + projId + '\',\'' + nid + '\')">Save</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="cancelNoteEdit(\'' + projId + '\')">Cancel</button>' +
        '</div></div>';
    }
    return '<div class="np-item" id="np-' + nid + '">' +
      '<div class="np-meta"><div class="av av-xs ' + n.who + '">' + n.who + '</div><span class="np-date">' + dt + '</span></div>' +
      '<div class="np-text">' + esc(n.text) + '</div>' +
      '<div class="np-actions">' +
      '<button class="np-btn" onclick="startNoteEdit(\'' + projId + '\',\'' + nid + '\')">Edit</button>' +
      '<button class="np-btn del" onclick="delNote(\'' + projId + '\',\'' + nid + '\')">Delete</button>' +
      '</div></div>';
  }).join('');
  list.scrollTop = list.scrollHeight;
}
function startNoteEdit(pid, nid) { editNoteId = nid; renderNotePanel(pid); var el = document.getElementById('ne-'+nid); if(el){el.focus();el.selectionStart=el.value.length;} }
function cancelNoteEdit(pid) { editNoteId = null; renderNotePanel(pid); }
function saveNoteEdit(pid, nid) {
  var el = document.getElementById('ne-' + nid); if (!el) return;
  var text = el.value.trim(); if (text) state.notes[pid][nid].text = text;
  persist(); editNoteId = null; renderNotePanel(pid);
}
function delNote(pid, nid) {
  if (!confirm('Delete this note?')) return;
  delete state.notes[pid][nid]; persist(); renderNotePanel(pid);
}

/* ── NOTES PAGE ── */
function setFilter(f, el) {
  notesFilter = f;
  document.querySelectorAll('.flt-btn').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  renderNotes();
}
function renderNotes() {
  var q = (document.getElementById('notes-q') ? document.getElementById('notes-q').value : '').toLowerCase().trim();
  var sec = document.getElementById('notes-sections'); if (!sec) return;
  var projIds = Object.keys(state.projects).filter(function(id){ var p = state.projects[id]; return p && !p.archived; });
  if (!projIds.length) { sec.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">No projects yet</div></div>'; return; }
  var anyShown = false;
  var html = '';
  projIds.forEach(function(pid) {
    var proj = state.projects[pid];
    var notes = state.notes[pid] || {};
    var entries = Object.keys(notes).sort(function(a,b){ return notes[b].ts - notes[a].ts; });
    if (notesFilter !== 'all') entries = entries.filter(function(nid){ return notes[nid].who === notesFilter; });
    if (q) entries = entries.filter(function(nid){ return notes[nid].text.toLowerCase().indexOf(q) >= 0; });
    if (!entries.length) return;
    anyShown = true;
    html += '<div class="notes-project-section">' +
      '<div class="proj-section-head">' +
      '<div class="proj-dot" style="background:' + (proj.color||'#C4873A') + ';width:9px;height:9px;flex-shrink:0"></div>' +
      '<span class="proj-section-name">' + esc(proj.name) + '</span>' +
      '<span class="proj-section-cnt">' + entries.length + ' note' + (entries.length!==1?'s':'') + '</span>' +
      '</div>';
    entries.forEach(function(nid) {
      var n = notes[nid];
      var dt = new Date(n.ts).toLocaleDateString('en-SG', { day:'numeric', month:'short' });
      html += '<div class="note-card' + (viewNoteId===nid?' on':'') + '" onclick="viewNote(\'' + nid + '\',\'' + pid + '\')">' +
        '<div class="note-preview">' + esc(n.text) + '</div>' +
        '<div class="note-card-meta"><div class="av av-xs ' + n.who + '">' + n.who + '</div><span>' + dt + '</span></div>' +
        '</div>';
    });
    html += '</div>';
  });
  if (!anyShown) {
    sec.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">' + (q ? 'No notes match "' + esc(q) + '"' : 'No notes yet. Add notes on project pages.') + '</div></div>';
    document.getElementById('note-reader').innerHTML = '<div class="note-view"><div class="empty"><div class="empty-icon">📝</div><div class="empty-text">Select a note to read</div></div></div>';
    return;
  }
  sec.innerHTML = html;
}
function viewNote(nid, pid) {
  viewNoteId = nid;
  var notes = state.notes[pid] || {};
  var n = notes[nid]; var proj = state.projects[pid];
  if (!n) return;
  var dt = new Date(n.ts).toLocaleDateString('en-SG', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('note-reader').innerHTML =
    '<div class="note-view">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">' +
    '<div class="av ' + n.who + '">' + n.who + '</div>' +
    '<div><div style="font-size:14px;font-weight:500">' + ({'L':'Leslie','S':'Serena','E':'Esther'}[n.who]||n.who) + '</div>' +
    '<div style="font-size:11px;color:var(--muted)">' + esc(proj?proj.name:'') + ' · ' + dt + '</div></div>' +
    '</div>' +
    '<div style="font-size:15px;line-height:1.7;white-space:pre-wrap">' + esc(n.text) + '</div>' +
    '<div style="margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="goProject(\'' + pid + '\')">→ Go to project</button></div>' +
    '</div>';
  // refresh to show active state
  renderNotes();
}

/* ── RENDER ALL ── */
function renderAll() {
  renderSidebar();
  if (curPage === 'dashboard') renderDash();
  else if (curPage === 'project' && curProjId) renderProject(curProjId);
  else if (curPage === 'notes') renderNotes();
}

/* ── BOOT ── */
window.addEventListener('DOMContentLoaded', function() {
  // modal backdrop close
  document.querySelectorAll('.modal-bg').forEach(function(el) {
    el.addEventListener('click', function(e) { if (e.target === el) el.classList.remove('open'); });
  });

  // init calendar to today
  CAL.year = TODAY.getFullYear();
  CAL.month = TODAY.getMonth();
  CAL.sel = TODAY_STR;

  // load data
  loadLocal();

  // try firebase
  initFB();

  // if no firebase, render now
  if (!USE_FB) {
    renderSidebar();
    renderDash();
  }
});
</script>
