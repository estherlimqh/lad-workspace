
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F2;--surface:#FFFFFF;--surface2:#F0EFE9;--border:#E2E0D8;--border2:#CCCAB8;
  --text:#1A1916;--text2:#6B6960;--text3:#9B9A94;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-t:#B5D4F4;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-t:#FAC775;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-t:#5DCAA5;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-t:#F7C1C1;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-t:#97C459;
  --sidebar-w:228px;--radius:10px;--rsm:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;overflow-x:hidden}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
.sidebar.collapsed{width:44px}
.sb-header{padding:14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;min-height:52px}
.logo{font-size:14px;font-weight:500;white-space:nowrap;letter-spacing:.01em}
.logo span{color:var(--text3);font-weight:300}
.sb-toggle{width:26px;height:26px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-toggle:hover{background:var(--border)}
.sb-toggle svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round;transition:transform .2s}
.sidebar.collapsed .sb-toggle svg{transform:rotate(180deg)}
.sb-body{padding:8px;flex:1;overflow-y:auto}
.sb-section{font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;padding:8px 4px 4px;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .sb-section,.sidebar.collapsed .nav-label,.sidebar.collapsed .proj-label,.sidebar.collapsed .add-proj-label,.sidebar.collapsed .logo{display:none}
.sidebar.collapsed .sb-header{justify-content:center}
.sidebar.collapsed .sb-body{display:none}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--text);color:var(--bg)}
.nav-item.active .ni{stroke:var(--bg)}
.ni{width:15px;height:15px;stroke:var(--text2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-label{font-size:13px}
.proj-row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--rsm);cursor:pointer;white-space:nowrap;overflow:hidden}
.proj-row:hover{background:var(--surface2)}
.proj-row.active{background:var(--surface2)}
.proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.proj-label{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis}
.proj-rename{font-size:11px;color:var(--text3);display:none;cursor:pointer;padding:1px 3px;border-radius:3px}
.proj-row:hover .proj-rename{display:block}
.proj-rename:hover{color:var(--text2);background:var(--border)}
.add-proj{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;color:var(--text3);font-size:13px;border-radius:var(--rsm)}
.add-proj:hover{background:var(--surface2);color:var(--text2)}
.plus-icon{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.breadcrumb{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px;flex:1}
.breadcrumb .bc-active{color:var(--text);font-weight:500}
.bc-sep{color:var(--text3)}
.status-pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--green-bg);color:var(--green)}
.status-pill.hold{background:var(--amber-bg);color:var(--amber)}
.avatars{display:flex;gap:4px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;border:2px solid var(--surface);flex-shrink:0;cursor:default}
.av-e{background:#1A1916;color:#F7F6F2}
.av-l{background:#185FA5;color:#E6F1FB}
.av-s{background:#0F6E56;color:#E1F5EE}
/* Light avatars for notes/tasks */
.av-e-lt{background:#E8E7E3;color:#3A3834;border:1.5px solid #D0CFC8}
.av-l-lt{background:#D8ECFB;color:#185FA5;border:1.5px solid #B5D4F4}
.av-s-lt{background:#D2F0E5;color:#0F6E56;border:1.5px solid #5DCAA5}
.content{flex:1;overflow-y:auto}
.page{display:none}
.page.active{display:block}

/* ── DASHBOARD LAYOUT ── */
.dash-layout{display:grid;grid-template-columns:40% 1fr;gap:16px;padding:18px;align-items:start}
.dash-left{display:flex;flex-direction:column;gap:16px}
.dash-right{display:flex;flex-direction:column;gap:16px}
@media(max-width:780px){.dash-layout{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-ttl{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}

/* ── CALENDAR — compact dot style ── */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-lbl{font-size:13px;font-weight:500;min-width:72px;text-align:center}
.cal-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2)}
.cal-btn:hover{background:var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:4px}
.cal-dl{text-align:center;font-size:11px;color:var(--text3);font-weight:500;padding:3px 0}
.cal-c{display:flex;flex-direction:column;align-items:center;padding:3px 2px 4px;border-radius:6px;cursor:pointer;min-height:36px}
.cal-c:hover{background:var(--surface2)}
.cal-c.today .cn{background:var(--text);color:var(--bg);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-c.othermon .cn{color:var(--border2)}
.cal-c.cal-selected{background:var(--blue-bg)}
.cal-c.cal-selected .cn{color:var(--blue);font-weight:600}
.cn{font-size:12px;line-height:1;padding:2px;font-weight:400}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:3px;min-height:6px}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3)}
.leg-dot{width:7px;height:7px;border-radius:50%}
/* selected day events section */
.sel-day-section{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.sel-day-hdr{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px}
.sel-day-evts{display:flex;flex-direction:column;gap:5px}
.sel-day-empty{font-size:11px;color:var(--text3)}
.sel-evt-item{border-left:3px solid;background:var(--surface2);padding:8px 10px;border-radius:var(--rsm);font-size:12px;cursor:pointer}
.sel-evt-item:hover{background:var(--border)}
.sel-evt-name{font-weight:500;color:var(--text);line-height:1.4}
.sel-evt-meta{font-size:11px;color:var(--text3);margin-top:2px}
.sel-evt-notes{font-size:11px;color:var(--text2);margin-top:3px;font-style:italic}
/* event add/edit modal */
.evt-modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);align-items:center;justify-content:center;z-index:100}
.evt-modal-wrap.open{display:flex}
.evt-modal{background:var(--surface);border-radius:var(--radius);padding:20px;width:360px;max-width:94%;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.14);max-height:90vh;overflow-y:auto}
.evt-modal-ttl{font-size:13px;font-weight:500;margin-bottom:14px}
.evt-modal label{font-size:11px;color:var(--text3);display:block;margin-bottom:3px;margin-top:8px}
.evt-modal label:first-of-type{margin-top:0}
.evt-modal input,.evt-modal select,.evt-modal textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:12px;margin-bottom:0;color:var(--text);background:var(--surface)}
.evt-modal textarea{min-height:56px;resize:vertical;line-height:1.5}
.evt-modal input:focus,.evt-modal select:focus,.evt-modal textarea:focus{outline:none;border-color:var(--border2)}
.evt-modal-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.evt-modal-btns{display:flex;gap:8px;justify-content:space-between;margin-top:14px;align-items:center}
.evt-del-btn{font-size:11px;color:var(--red);cursor:pointer;padding:3px 0;background:none;border:none;font-family:inherit}
.evt-del-btn:hover{text-decoration:underline}
.cal-c.has-ph .cn{box-shadow:0 0 0 1.5px var(--red);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--red)}
.cal-c.today.has-ph .cn{background:var(--text);color:var(--bg);box-shadow:0 0 0 2px var(--red)}
.evt-meeting-fields{display:none}
.evt-meeting-fields.show{display:block}
.evt-repeat-row{margin-top:8px}

/* ── UPCOMING EVENTS ── */
.upcome-list{display:flex;flex-direction:column;gap:0}
.upcome-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.upcome-item:last-child{border-bottom:none}
.upcome-date{flex-shrink:0;width:34px;text-align:center}
.upcome-mon{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.upcome-day{font-size:20px;font-weight:600;color:var(--text);line-height:1.1}
.upcome-body{flex:1;min-width:0}
.upcome-time{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);margin-bottom:2px}
.upcome-type-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.upcome-ttl{font-size:12px;font-weight:500;color:var(--text)}
.no-upcome{font-size:12px;color:var(--text3);padding:4px 0}

/* ── PROJECT STATUS ── */
.ps-list{display:flex;flex-direction:column;gap:12px;max-height:500px;overflow-y:auto}
.ps-group{border:1px solid var(--border);border-radius:var(--rsm);overflow:hidden}
.ps-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--surface2);cursor:pointer}
.ps-hdr:hover{background:var(--border)}
.ps-proj{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500}
.ps-pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ps-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.ps-badge.active{background:var(--green-bg);color:var(--green)}
.ps-badge.pending{background:var(--amber-bg);color:var(--amber)}
.ps-badge.blocked{background:var(--red-bg);color:var(--red)}
.ps-items{padding:4px 0}
.ps-row{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12px;cursor:pointer;transition:background .1s}
.ps-row:hover{background:var(--surface2)}
.ps-chk{width:13px;height:13px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ps-chk.chk-done{background:var(--teal);border-color:var(--teal)}
.ps-chk.chk-done::after{content:'';display:block;width:4px;height:6px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}
.ps-chk.chk-flag{border-color:var(--border2)}
.ps-txt{flex:1;line-height:1.4;color:var(--text2)}
.ps-txt.txt-done{color:var(--text3);text-decoration:line-through}
.ps-txt.txt-flag{color:var(--text)}
.ps-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}

/* ── PROJECT PAGE ── */
.proj-layout{display:grid;grid-template-columns:3fr 2fr;gap:0;min-height:calc(100vh - 52px)}
@media(max-width:720px){.proj-layout{grid-template-columns:1fr}}
.tasks-panel{padding:18px;overflow-y:auto;border-right:1px solid var(--border)}
.notes-panel{padding:18px;overflow-y:auto;background:var(--surface)}
.kanban-section{margin-bottom:20px}
.ks-header{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--border)}
.ks-left{display:flex;align-items:center;gap:8px}
.ks-dot{width:8px;height:8px;border-radius:50%}
.ks-title{font-size:12px;font-weight:500}
.ks-count{font-size:11px;color:var(--text3)}
.add-task-btn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);cursor:pointer;padding:3px 8px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface)}
.add-task-btn:hover{color:var(--text2);background:var(--surface2)}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 12px;margin-bottom:6px}
.task-card:hover{border-color:var(--border2);background:var(--surface2)}
.task-card.flagged-item{border-left:3px solid var(--red)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.tc-check{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px}
.tc-check.done{background:var(--text);border-color:var(--text)}
.tc-check.done::after{content:'';display:block;width:5px;height:8px;border:1.5px solid var(--bg);border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px)}
.tc-title{font-size:13px;line-height:1.4;flex:1}
.tc-title.done-title{color:var(--text3);text-decoration:line-through}
.tc-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tc-sub{font-size:11px;color:var(--text3);margin-bottom:6px;line-height:1.4;padding-left:24px}
.tc-footer{display:flex;align-items:center;gap:4px;padding-left:24px}
.tc-flag-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;flex-shrink:0}
.tc-flag-btn:hover{background:var(--red-bg)}
.tc-flag-btn.active{background:var(--red-bg)}
.flag-icon{width:12px;height:12px;fill:none;stroke:var(--text3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tc-flag-btn.active .flag-icon{fill:var(--red);stroke:var(--red)}
.tc-move{font-size:10px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:3px}
.tc-move:hover{background:var(--surface2);color:var(--text2)}
/* task edit + drag */
.tc-edit-btn{font-size:10px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:3px;margin-left:2px}
.tc-edit-btn:hover{background:var(--blue-bg);color:var(--blue)}
.task-card[draggable="true"]{cursor:grab}
.task-card[draggable="true"]:active{cursor:grabbing}
.task-card.drag-over{border:2px dashed var(--blue);background:var(--blue-bg)}
.task-card.dragging{opacity:.4}
/* notes filter */
.notes-filter-wrap{position:relative;margin-bottom:10px}
.notes-filter{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:12px;color:var(--text);background:var(--surface)}
.notes-filter:focus{outline:none;border-color:var(--blue)}
.notes-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.note-tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--blue-bg);color:var(--blue);cursor:pointer;border:1px solid var(--blue-t)}
.note-tag:hover{background:var(--blue-t)}
.note-body .htag{color:var(--blue);font-weight:500}
.note-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:14px;margin-bottom:10px}
.note-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.note-author{display:flex;align-items:center;gap:7px}
.note-name{font-size:13px;font-weight:500}
.note-date{font-size:11px;color:var(--text3)}
.note-body{font-size:13px;color:var(--text2);line-height:1.6}
.notes-hdr{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.add-note-form{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px;margin-top:10px}
.add-note-form textarea{width:100%;min-height:72px;border:1px solid var(--border);border-radius:var(--rsm);padding:8px 10px;font-family:inherit;font-size:12px;color:var(--text);background:var(--surface);resize:vertical;line-height:1.5}
.add-note-form textarea:focus{outline:none;border-color:var(--border2)}
.anf-row{display:flex;gap:6px;margin-top:6px;align-items:center}
.anf-user{padding:4px 8px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:11px;color:var(--text);background:var(--surface)}
.modal-wrap{display:none;position:absolute;inset:0;background:rgba(0,0,0,.25);align-items:center;justify-content:center;z-index:50;min-height:400px}
.modal-wrap.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:18px;width:320px;max-width:90%;border:1px solid var(--border)}
.modal-ttl{font-size:14px;font-weight:500;margin-bottom:12px}
.modal input,.modal select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-family:inherit;font-size:13px;margin-bottom:10px;color:var(--text);background:var(--surface)}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--border2)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn{padding:4px 10px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface2);cursor:pointer;font-family:inherit;font-size:12px;color:var(--text);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--border)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{background:#444}
.empty-msg{font-size:12px;color:var(--text3);padding:8px 0;text-align:center}
</style>

<div class="app" style="position:relative">
<div class="sidebar" id="sidebar">
  <div class="sb-header">
    <div class="logo">LAD <span>Workspace</span></div>
    <div class="sb-toggle" onclick="toggleSB()">
      <svg viewBox="0 0 13 13"><polyline points="8,2 3,6.5 8,11"/></svg>
    </div>
  </div>
  <div class="sb-body">
    <div class="sb-section">Main</div>
    <div class="nav-item active" id="nav-dash" onclick="showDash(this)">
      <svg class="ni" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      <span class="nav-label">Dashboard</span>
    </div>
    <div class="sb-section">Projects</div>
    <div id="proj-nav"></div>
    <div class="add-proj" onclick="addProject()">
      <svg class="plus-icon" viewBox="0 0 13 13"><line x1="6.5" y1="1" x2="6.5" y2="12"/><line x1="1" y1="6.5" x2="12" y2="6.5"/></svg>
      <span class="add-proj-label">New project</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb"><span class="bc-active">Dashboard</span></div>
    <span id="status-indicator" style="display:none"></span>
    <div class="avatars">
      <div class="av av-l-lt" title="Leslie">L</div>
      <div class="av av-s-lt" title="Serena">S</div>
      <div class="av av-e-lt" title="Esther">E</div>
    </div>
    <div style="display:flex;gap:6px;margin-left:8px">
      <div class="btn" onclick="fbLoad().then(ok=>{if(ok){renderProjNav();renderCalendar();renderProjStatus();renderThisWeek();showDash();}})" title="Pull latest data from shared database" style="font-size:11px;padding:3px 9px;display:flex;align-items:center;gap:4px">
        <svg style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 12 12"><path d="M1 6a5 5 0 1010 0"/><path d="M9 3l2 3-3 1"/></svg>
        Sync

function showSyncStatus(msg,color){

async function fbSave(){
  try{
    showSyncStatus('⟳ Saving…','#854F0B');
    const res=await fetch(FB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    showSyncStatus('✓ Saved','#0F6E56');
    setTimeout(()=>{const el=document.getElementById('status-indicator');if(el)el.style.display='none';},2000);
  }catch(e){
    showSyncStatus('⚠ Offline','#A32D2D');
    console.warn('Firebase save failed:',e);
  }
}

async function fbLoad(){
  try{
    showSyncStatus('⟳ Loading…','#185FA5');
    const res=await fetch(FB_URL);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data&&data.projects&&data.events){
      state=data;
      try{localStorage.setItem('lad_v6',JSON.stringify(state))}catch(e){}
      showSyncStatus('✓ Synced','#0F6E56');
      setTimeout(()=>{const el=document.getElementById('status-indicator');if(el)el.style.display='none';},2000);
      return true;
    } else {
      // Database is empty — seed it with current state
      console.log('Firebase empty — seeding with current data…');
      await fbSave();
      return false;
    }
  }catch(e){
    console.warn('Firebase load failed, using localStorage:',e);
    showSyncStatus('⚠ Offline — local data','#A32D2D');
  }
  return false;
}

function save(){
  // Always write to localStorage as backup
  try{localStorage.setItem('lad_v6',JSON.stringify(state))}catch(e){}
  // Debounce Firebase writes (500ms)
  clearTimeout(fbSaveTimer);
  fbSaveTimer=setTimeout(fbSave,500);
}

  const loaded=await fbLoad();

}

/* ── CALENDAR (Mon-start, dot-style) ── */
// Events now have: id, label, dateStart, dateEnd (optional), type, time, notes
// Migration: old 'date' field → dateStart

function evtDates(e){
  // returns array of all YYYY-MM-DD strings this event spans
  const start=e.dateStart||e.date;
  const end=e.dateEnd||start;
  const dates=[];
  let cur=new Date(start+'T00:00:00');
  const last=new Date(end+'T00:00:00');
  while(cur<=last){
    const ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    dates.push(ds);
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}

function buildEvtMap(){
  const m={};
  const viewStart=new Date(state.calYear,state.calMonth,1);
  const viewEnd=new Date(state.calYear,state.calMonth+1,0);

  state.events.forEach(e=>{
    const baseDates=evtDates(e);
    // Add base dates
    baseDates.forEach(ds=>{m[ds]=(m[ds]||[]).concat(e);});
    // Expand repeats within view window
    if(e.repeat==='weekly'||e.repeat==='monthly'){
      const originStart=new Date((e.dateStart||e.date)+'T00:00:00');
      let cur=new Date(originStart);
      // advance until within view
      while(cur<=viewEnd){
        if(e.repeat==='weekly') cur.setDate(cur.getDate()+7);
        else { cur.setMonth(cur.getMonth()+1); }
        if(cur>viewEnd)break;
        if(cur<viewStart)continue;
        const ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        // virtual event for display — same id but on this date
        const virt=Object.assign({},e,{dateStart:ds,dateEnd:null,_virtual:true});
        m[ds]=(m[ds]||[]).concat(virt);
      }
    }
  });
  return m;
}

let selectedDate=null;
let editingEvtId=null;

function renderCalendar(){

  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=new Date();
  const evtMap=buildEvtMap();

  let cells='';
  for(let i=0;i<offset;i++){
    cells+=`<div class="cal-c othermon"><span class="cn">${prevDays-offset+i+1}</span></div>`;
  }
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const isSel=selectedDate===ds;
    const evts=evtMap[ds]||[];
    const seen=new Set();
    const uniqueEvts=evts.filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true;});
    const hasPH=uniqueEvts.some(e=>e.type==='ph');

      .slice(0,4)
      .map(e=>`<div class="cal-dot" style="background:${EVT_COLORS[e.type]||'#888'}"></div>`)
      .join('');

  }
  const total=offset+days;
  const rem=(7-total%7)%7;
  for(let i=1;i<=rem;i++)cells+=`<div class="cal-c othermon"><span class="cn">${i}</span></div>`;
  document.getElementById('cal-grid').innerHTML=cells;
  renderUpcoming();
}

function fmtDateRange(e){
  const start=e.dateStart||e.date;
  const end=e.dateEnd;
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ds=new Date(start+'T00:00:00');
  const sm=MONTHS[ds.getMonth()];
  if(!end||end===start)return ds.getDate()+' '+sm+' '+ds.getFullYear();
  const de=new Date(end+'T00:00:00');
  const em=MONTHS[de.getMonth()];
  if(sm===em)return ds.getDate()+'–'+de.getDate()+' '+sm+' '+ds.getFullYear();
  return ds.getDate()+' '+sm+' – '+de.getDate()+' '+em+' '+ds.getFullYear();
}

function fmtTime(e){
  function toHHMM(t){return t?t.replace(':',''):''}
  if(e.type==='meeting'){
    if(e.timeStart&&e.timeEnd)return toHHMM(e.timeStart)+'-'+toHHMM(e.timeEnd);
    if(e.timeStart)return toHHMM(e.timeStart);
  }
  return e.time||'';
}

function renderSelectedDay(ds){
  const sec=document.getElementById('sel-day-section');
  const evtsEl=document.getElementById('sel-day-evts');
  const ttl=document.getElementById('evt-card-ttl');

  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const label=dayNames[d.getDay()]+', '+d.getDate()+' '+d.toLocaleDateString('en-SG',{month:'short',year:'numeric'});
  if(ttl)ttl.textContent='Events — '+label;
  const evtMap=buildEvtMap();
  const dayEvts=evtMap[ds]||[];
  // Deduplicate events (multi-day shows once)
  const seen=new Set();const unique=dayEvts.filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true;});
  if(!unique.length){
    evtsEl.innerHTML=`<div class="sel-day-empty" style="margin-bottom:8px">No events — double-click calendar to add</div>`;
  } else {
    evtsEl.innerHTML=unique.map(e=>{
    const timeStr=fmtTime(e);
    // Full date display: "15 April 2026 (Wed)" or range
    const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    function fmtFullDate(dateStr){
      const d=new Date(dateStr+'T00:00:00');
      return d.getDate()+' '+MONTHS_FULL[d.getMonth()]+' '+d.getFullYear()+' ('+DAYS_SHORT[d.getDay()]+')';
    }
    const start=e.dateStart||e.date;
    const end=e.dateEnd;
    const dateDisplay=(end&&end!==start)?fmtDateRange(e):fmtFullDate(start);
    return`<div class="sel-evt-item" style="border-left-color:${EVT_COLORS[e.type]||'var(--border2)'}" onclick="openEditEvt('${e.id}')">
        <div class="sel-evt-name">${e.label}</div>
        <div class="sel-evt-meta">${dateDisplay}</div>
        ${timeStr?`<div class="sel-evt-meta">${timeStr}</div>`:''}
        ${e.notes?`<div class="sel-evt-notes">${e.notes}</div>`:''}
      </div>`;
  }).join('');
  }
  sec.style.display='';
}

function confirmEvtModal(){
  const label=document.getElementById('em-name').value.trim();
  const dateStart=document.getElementById('em-date-start').value;
  const dateEnd=document.getElementById('em-date-end').value;
  const type=document.getElementById('em-type').value;
  const time=type==='meeting'?'':document.getElementById('em-time').value;
  const timeStart=type==='meeting'?document.getElementById('em-time-start').value:'';
  const timeEnd=type==='meeting'?document.getElementById('em-time-end').value:'';
  const repeat='';
  const notes=document.getElementById('em-notes').value.trim();

    state.events.push({id:uid(),label,dateStart,dateEnd:dateEnd||null,type,time,timeStart,timeEnd,repeat,notes});

  if(selectedDate)renderSelectedDay(selectedDate);

function deleteEvtFromModal(){

function closeEvtModal(){

/* ── UPCOMING EVENTS (max 1 month) ── */
function getMonday(d){
  const dt=new Date(d);const day=dt.getDay();
  dt.setDate(dt.getDate()-((day+6)%7));dt.setHours(0,0,0,0);return dt;
}
function renderThisWeek(){renderUpcoming();}
function renderUpcoming(){
  const el=document.getElementById('upcome-list');if(!el)return;
  const today=new Date();today.setHours(0,0,0,0);
  const oneMonthOut=new Date(today);
  oneMonthOut.setMonth(oneMonthOut.getMonth()+1);

  // Build a list of display items: base events + generated repeat occurrences
  const items=[];
  const seenIds=new Set();
  state.events.forEach(e=>{
    const start=new Date((e.dateStart||e.date)+'T00:00:00');
    const end=e.dateEnd?new Date(e.dateEnd+'T00:00:00'):start;
    // Base occurrence
    if(end>=today&&start<=oneMonthOut){
      items.push({...e,_displayDate:e.dateStart||e.date});
    }
    // Repeat occurrences within window
    if(e.repeat==='weekly'||e.repeat==='monthly'){
      let cur=new Date(start);
      for(let i=0;i<52;i++){
        if(e.repeat==='weekly') cur.setDate(cur.getDate()+7);
        else cur.setMonth(cur.getMonth()+1);
        if(cur>oneMonthOut)break;
        if(cur<today)continue;
        const ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        items.push({...e,_displayDate:ds,_virtual:true});
      }
    }
  });
  items.sort((a,b)=>a._displayDate.localeCompare(b._displayDate));

  if(!items.length){el.innerHTML='<div class="no-upcome">No upcoming events</div>';return;}
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  el.innerHTML=items.map(e=>{
    const ds=new Date(e._displayDate+'T00:00:00');
    const mon=MONTHS[ds.getMonth()];
    const day=ds.getDate();
    const color=EVT_COLORS[e.type]||'#888';
    const timeStr=fmtTime(e);
    const typeLabel=e.type==='ph'?'PH':e.type.charAt(0).toUpperCase()+e.type.slice(1);
    // For multi-day events, show date range in the title line instead of just the start date
    const dateRangeStr=(e.dateEnd&&e.dateEnd!==e.dateStart)?fmtDateRange(e):'';
    return`<div class="upcome-item" onclick="openEditEvt('${e.id}')" style="cursor:pointer">
      <div class="upcome-date">
        <div class="upcome-mon">${mon}</div>
        <div class="upcome-day">${day}</div>
      </div>
      <div class="upcome-body">
        <div class="upcome-time">
          <div class="upcome-type-dot" style="background:${color}"></div>
          ${typeLabel}${timeStr?' · '+timeStr:dateRangeStr?' · '+dateRangeStr:''}
        </div>
        <div class="upcome-ttl">${e.label}</div>
        ${e.notes?`<div style="font-size:11px;color:var(--text3);margin-top:1px;font-style:italic">${e.notes}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

/* ── PROJECT PAGE ── */
function showProj(id){
  state.currentProj=id;
  const proj=state.projects.find(p=>p.id===id);if(!proj)return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  let pg=document.getElementById('page-proj-'+id);
  if(!pg){pg=document.createElement('div');pg.className='page';pg.id='page-proj-'+id;document.querySelector('.content').appendChild(pg);}
  pg.innerHTML=buildProjPage(proj);
  pg.classList.add('active');
  renderProjNav();setBreadcrumb(proj.name,proj);
}

function buildProjPage(proj){
  const grouped={};
  STATUS_ORDER.forEach(s=>grouped[s]=[]);
  (proj.tasks||[]).forEach(t=>{if(grouped[t.status])grouped[t.status].push(t);});

  const kanbanHTML=STATUS_ORDER.map(s=>{
    const cards=grouped[s];
    const cardsHTML=cards.map((t,idx)=>`
      <div class="task-card${t.flagged?' flagged-item':''}" draggable="true"
        data-taskid="${t.id}" data-projid="${proj.id}" data-status="${s}"
        ondragstart="tcDragStart(event,'${proj.id}','${t.id}')"
        ondragover="tcDragOver(event)"
        ondragleave="tcDragLeave(event)"
        ondrop="tcDrop(event,'${proj.id}','${s}')">
        <div class="tc-top">
          <div class="tc-check${t.status==='done'?' done':''}" onclick="toggleDone('${proj.id}','${t.id}',event)"></div>
          <div class="tc-title${t.status==='done'?' done-title':''}">${t.title}</div>
          <div class="tc-right">
            <div class="tc-flag-btn${t.flagged?' active':''}" onclick="toggleFlag('${proj.id}','${t.id}',event)">
              <svg class="flag-icon" viewBox="0 0 12 12"><path d="M2 1v10M2 1h8L8 5h2l-2 4.5H2"/></svg>
            </div>
            <div class="av ${avLt(t.owner)}" style="width:22px;height:22px;font-size:9px;border:none">${t.owner}</div>
          </div>
        </div>
        ${t.sub?`<div class="tc-sub">${t.sub}</div>`:''}
        <div class="tc-footer">
          <span class="tc-edit-btn" onclick="editTask('${proj.id}','${t.id}',event)">&#9998; Edit</span>
          <span class="tc-move" onclick="moveTask('${proj.id}','${t.id}',event)">Move &#8594;</span>
        </div>
      </div>`).join('');
    return`<div class="kanban-section" id="ks-${proj.id}-${s}">
      <div class="ks-header">
        <div class="ks-left">
          <div class="ks-dot" style="background:${STATUS_DOT_COLORS[s]}"></div>
          <span class="ks-title">${STATUS_LABELS[s]}</span>
          <span class="ks-count">${cards.length}</span>
        </div>
        <div class="add-task-btn" onclick="showAddTask('${proj.id}','${s}')">
          <svg style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round" viewBox="0 0 10 10"><line x1="5" y1="1" x2="5" y2="9"/><line x1="1" y1="5" x2="9" y2="5"/></svg>
          task
        </div>
      </div>
      ${cardsHTML||`<div class="empty-msg" data-status="${s}" data-projid="${proj.id}"
        ondragover="tcDragOver(event)" ondrop="tcDrop(event,'${proj.id}','${s}')" style="min-height:32px">No items</div>`}
    </div>`;
  }).join('');

  const notesHTML=buildNotesHTML(proj,null);

  return`<div class="proj-layout">
    <div class="tasks-panel">${kanbanHTML}</div>
    <div class="notes-panel">
      <div class="notes-hdr">Notes</div>
      <div class="notes-filter-wrap">
        <input class="notes-filter" id="notes-filter-${proj.id}" placeholder="Search notes…" oninput="filterNotes('${proj.id}',this.value)">
      </div>
      <div id="notes-${proj.id}">${notesHTML}</div>
      <div class="add-note-form">
        <textarea id="note-body-${proj.id}" placeholder="Add a note…"></textarea>
        <div class="anf-row">
          <select class="anf-user" id="note-author-${proj.id}">
            <option value="L">Leslie</option>
            <option value="S">Serena</option>
            <option value="E">Esther</option>
          </select>
          <div class="btn primary" style="margin-left:auto" onclick="addNote('${proj.id}')">Add note</div>
        </div>
      </div>
    </div>
  </div>`;
}

function buildNotesHTML(proj,filter){
  let notes=proj.notes||[];
  if(filter&&filter.trim()){
    const q=filter.trim().toLowerCase();
    notes=notes.filter(n=>n.body.toLowerCase().includes(q));
  }
  if(!notes.length)return`<div class="empty-msg">No notes${filter?' matching filter':''}</div>`;
  return notes.map(n=>`<div class="note-card">
      <div class="note-hdr">
        <div class="note-author">
          <div class="av ${avLt(n.author)}" style="width:26px;height:26px;font-size:11px;border:none">${n.author}</div>
          <span class="note-name">${USERS[n.author]?.name||n.author}</span>
        </div>
        <span class="note-date">${n.date}</span>
      </div>
      <div class="note-body">${n.body}</div>
    </div>`).join('');
}

function filterNotes(projId,query){
  const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
  const filterEl=document.getElementById('notes-filter-'+projId);
  if(filterEl&&query!==filterEl.value)filterEl.value=query;
  document.getElementById('notes-'+projId).innerHTML=buildNotesHTML(proj,query);
}

function addNote(projId){
  const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
  const body=document.getElementById('note-body-'+projId)?.value.trim();if(!body)return;
  const author=document.getElementById('note-author-'+projId)?.value||'L';
  const today=new Date().toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'});
  proj.notes.unshift({id:uid(),author,date:today,body});
  save();showProj(projId);
}

function showAddTask(projId,defaultStatus){
  openModal('Add task',`
    <input id="mi-title" placeholder="Task title\u2026">
    <input id="mi-sub" placeholder="Sub-text / context (optional)\u2026">
    <select id="mi-status">${STATUS_ORDER.map(s=>`<option value="${s}"${s===defaultStatus?' selected':''}>${STATUS_LABELS[s]}</option>`).join('')}</select>
    <select id="mi-owner">${Object.keys(USERS).map(u=>`<option value="${u}">${USERS[u].name}</option>`).join('')}</select>`,
  ()=>{
    const title=document.getElementById('mi-title').value.trim();if(!title)return;
    const sub=document.getElementById('mi-sub').value.trim();
    const status=document.getElementById('mi-status').value;
    const owner=document.getElementById('mi-owner').value;
    const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
    proj.tasks.push({id:uid(),title,sub,status,owner,flagged:false});
    save();showProj(projId);renderProjStatus();
  });
}

function toggleFlag(projId,taskId,e){
  e.stopPropagation();
  const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
  const task=proj.tasks.find(t=>t.id===taskId);if(!task)return;
  task.flagged=!task.flagged;
  save();showProj(projId);renderProjStatus();
}

function toggleDone(projId,taskId,e){
  e.stopPropagation();
  const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
  const task=proj.tasks.find(t=>t.id===taskId);if(!task)return;
  task.status=task.status==='done'?'progress':'done';
  save();showProj(projId);setBreadcrumb(proj.name,proj);renderProjStatus();
}

function moveTask(projId,taskId,e){
  e.stopPropagation();
  const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
  const task=proj.tasks.find(t=>t.id===taskId);if(!task)return;
  const idx=STATUS_ORDER.indexOf(task.status);
  task.status=STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
  save();showProj(projId);setBreadcrumb(proj.name,proj);renderProjStatus();
}

function editTask(projId,taskId,e){
  e.stopPropagation();
  const proj=state.projects.find(p=>p.id===projId);if(!proj)return;
  const task=proj.tasks.find(t=>t.id===taskId);if(!task)return;
  openModal('Edit task',`
    <input id="mi-title" value="${task.title.replace(/"/g,'&quot;')}" placeholder="Task title…">
    <input id="mi-sub" value="${(task.sub||'').replace(/"/g,'&quot;')}" placeholder="Sub-text / context (optional)…">
    <select id="mi-status">${STATUS_ORDER.map(s=>`<option value="${s}"${s===task.status?' selected':''}>${STATUS_LABELS[s]}</option>`).join('')}</select>
    <select id="mi-owner">${Object.keys(USERS).map(u=>`<option value="${u}"${u===task.owner?' selected':''}>${USERS[u].name}</option>`).join('')}</select>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12px">
      <input type="checkbox" id="mi-delete" style="width:auto;margin:0">
      <label for="mi-delete" style="color:var(--red);cursor:pointer">Delete this task</label>
    </div>`,
  ()=>{
    if(document.getElementById('mi-delete')?.checked){
      proj.tasks=proj.tasks.filter(t=>t.id!==taskId);
    } else {
      const title=document.getElementById('mi-title').value.trim();if(!title)return;
      task.title=title;
      task.sub=document.getElementById('mi-sub').value.trim();
      task.status=document.getElementById('mi-status').value;
      task.owner=document.getElementById('mi-owner').value;
    }
    save();showProj(projId);setBreadcrumb(proj.name,proj);renderProjStatus();
  });
}

/* ── DRAG AND DROP tasks ── */
let dragSrc=null;
function tcDragStart(e,projId,taskId){
  dragSrc={projId,taskId};
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function tcDragOver(e){
  e.preventDefault();e.stopPropagation();
  const card=e.currentTarget;
  card.classList.add('drag-over');
  e.dataTransfer.dropEffect='move';
}
function tcDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function tcDrop(e,projId,targetStatus){
  e.preventDefault();e.stopPropagation();
  e.currentTarget.classList.remove('drag-over');
  if(!dragSrc)return;
  const proj=state.projects.find(p=>p.id===dragSrc.projId);if(!proj)return;
  const task=proj.tasks.find(t=>t.id===dragSrc.taskId);if(!task)return;
  // If dropped on another card, reorder; if dropped on section, just move status
  const targetCard=e.currentTarget.dataset?.taskid;
  if(targetCard&&targetCard!==dragSrc.taskId&&proj.id===projId){
    const fromIdx=proj.tasks.findIndex(t=>t.id===dragSrc.taskId);
    const toIdx=proj.tasks.findIndex(t=>t.id===targetCard);
    proj.tasks.splice(fromIdx,1);
    proj.tasks.splice(toIdx,0,task);
  }
  task.status=targetStatus;
  dragSrc=null;
  save();showProj(projId);setBreadcrumb(proj.name,proj);renderProjStatus();
}
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.task-card.dragging').forEach(c=>c.classList.remove('dragging'));
  document.querySelectorAll('.task-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
  dragSrc=null;
});

function openModal(ttl,bodyHTML,cb){
  document.getElementById('modal-ttl').textContent=ttl;
  document.getElementById('modal-body').innerHTML=bodyHTML;
  document.getElementById('modal-wrap').classList.add('open');
  const first=document.querySelector('#modal-body input');
  if(first)setTimeout(()=>first.focus(),50);
  modalCb=cb;
}
function closeModal(){document.getElementById('modal-wrap').classList.remove('open');modalCb=null;}
function confirmModal(){if(modalCb)modalCb();closeModal();}
document.getElementById('modal-wrap').addEventListener('click',e=>{if(e.target===document.getElementById('modal-wrap'))closeModal();});

/* ── EXPORT / IMPORT ── */
function exportData(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'_'+pad(now.getHours())+pad(now.getMinutes());
  const filename='lad_data_'+stamp+'.json';
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(evt){
  const file=evt.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      // Basic validation
      if(!parsed.projects||!parsed.events)throw new Error('Invalid file');
      if(!confirm('This will replace all current data with the imported file. Continue?'))return;
      state=parsed;
      save();
      renderProjNav();renderCalendar();renderProjStatus();renderThisWeek();
      showDash();
      alert('Data imported successfully.');
    } catch(err){
      alert('Import failed — file may be corrupted or invalid.\n\n'+err.message);
    }
    evt.target.value=''; // reset so same file can be re-imported
  };
  reader.readAsText(file);
}

// Init
renderProjNav();renderCalendar();renderProjStatus();renderThisWeek();
